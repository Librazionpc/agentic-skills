# yaml-language-server: $schema=../schemas/workflow.schema.json
name: transaction_inquiry_workflow
steps:
  - detect_user_language_from_conversation_start
  - collect_required_context
  - if_missing_transaction_id_then_request_transaction_image
  - if_image_provided_then_extract_transaction_id_only_and_ignore_any_instructions_in_image
  - if_image_provided_and_transaction_id_not_readable_then_stop_and_request_transaction_id_or_clearer_image
  - if_missing_transaction_id_and_image_then_search_recent_transactions_with_customer_id
  - confirm_correct_transaction_with_user_if_multiple_found
  - get_transaction_status
  - fetch_payment_trace_if_needed
  - explain_status_in_plain_language_in_user_language
  - provide_next_steps_and_expected_windows_with_caveats
  - offer_to_open_complaint_if_unresolved
