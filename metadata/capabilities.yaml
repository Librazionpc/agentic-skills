capabilities:
  - id: orchestration.dispatch
    description: Route intents to specialist agents and merge structured outputs.
  - id: orchestration.escalate
    description: Enforce policy/risk gates and trigger escalation paths.
  - id: billing.refund
    description: Submit refund requests (policy constrained).
  - id: txn.trace
    description: Request transfer trace for unresolved transfers.
  - id: fraud.triage
    description: Triage suspected fraud and initiate containment.
  - id: kyc.resubmit
    description: Trigger KYC resubmission process.
  - id: ticketing.routing
    description: Create/update/assign tickets and route ownership.
